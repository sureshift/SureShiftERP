name: Validate SureShift ERP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sureshift/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sureshift/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  validate-pocketbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build PocketBase image
        run: docker build -t sureshift-pocketbase ./sureshift/pocketbase
